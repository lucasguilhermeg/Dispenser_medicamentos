<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispenser de Medicamentos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
        }

        h2 {
            color: #34495e;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .subtitulo {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #2c3e50;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }

        .horarios-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .horario-linha {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .horario-linha input {
            flex: 1;
        }

        .btn-remover {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        .btn-secundario {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #ecf0f1;
            color: #2c3e50;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-secundario:hover { background: #dfe6e9; }

        .btn-primario {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primario:hover { background: #27ae60; }

        .btn-dispensar {
            width: 100%;
            padding: 14px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-dispensar:hover { background: #2980b9; }

        .status {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .status.sucesso { background: #d5f5e3; color: #1e8449; display: block; }
        .status.erro    { background: #fadbd8; color: #922b21; display: block; }

        .divisor {
            border: none;
            border-top: 1px solid #eee;
            margin: 16px 0;
        }
    </style>
</head>
<body>

    <h1>💊 Dispenser</h1>
    <p class="subtitulo">Gerenciamento de medicamentos</p>

    <!-- ── CADASTRO DE ROTINA ── -->
    <div class="card">
        <h2>📋 Cadastrar Rotina</h2>

        <div id="lista-medicamentos"></div>

        <button class="btn-secundario" onclick="adicionarMedicamento()">
            + Adicionar medicamento
        </button>

        <hr class="divisor">

        <button class="btn-primario" onclick="enviarRotina()">
            ✅ Enviar rotina ao dispenser
        </button>

        <div id="status-rotina" class="status"></div>
    </div>

    <!-- ── CONTROLE MANUAL ── -->
    <div class="card">
        <h2>🎮 Controle Manual</h2>

        <label>Compartimento</label>
        <select id="compartimento-manual">
            <option value="1">Compartimento 1</option>
            <option value="2">Compartimento 2</option>
            <option value="3">Compartimento 3</option>
            <option value="4">Compartimento 4</option>
        </select>

        <button class="btn-dispensar" onclick="dispensarManual()">
            ⚙️ Dispensar agora
        </button>

        <div id="status-comando" class="status"></div>
    </div>

<script>
    // ── Estado da aplicação ───────────────────────────────────
    let medicamentos = []

    // ── Inicializa com um medicamento vazio ───────────────────
    adicionarMedicamento()

    function adicionarMedicamento() {
        const id = Date.now()
        medicamentos.push({ id, horarios: [Date.now()] })
        renderizarMedicamentos()
    }

    function removerMedicamento(id) {
        medicamentos = medicamentos.filter(m => m.id !== id)
        renderizarMedicamentos()
    }

    function adicionarHorario(medId) {
        const med = medicamentos.find(m => m.id === medId)
        if (med.horarios.length < 5) {
            med.horarios.push(Date.now())
            renderizarMedicamentos()
        }
    }

    function removerHorario(medId, horId) {
        const med = medicamentos.find(m => m.id === medId)
        if (med.horarios.length > 1) {
            med.horarios = med.horarios.filter(h => h !== horId)
            renderizarMedicamentos()
        }
    }

    // ── Renderiza a lista de medicamentos na tela ─────────────
    function renderizarMedicamentos() {
        const container = document.getElementById('lista-medicamentos')
        container.innerHTML = ''

        medicamentos.forEach((med, index) => {
            const div = document.createElement('div')
            div.style.cssText = 'border:1px solid #eee; border-radius:8px; padding:12px; margin-bottom:12px;'

            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <strong style="font-size:14px; color:#2c3e50;">Medicamento ${index + 1}</strong>
                    ${medicamentos.length > 1
                        ? `<button class="btn-remover" onclick="removerMedicamento(${med.id})">✕</button>`
                        : ''}
                </div>

                <label>Nome</label>
                <input type="text" id="nome-${med.id}" placeholder="Ex: Losartana">

                <label>Compartimento</label>
                <select id="comp-${med.id}">
                    <option value="1">Compartimento 1</option>
                    <option value="2">Compartimento 2</option>
                    <option value="3">Compartimento 3</option>
                    <option value="4">Compartimento 4</option>
                </select>

                <label>Horários</label>
                <div class="horarios-container" id="horarios-${med.id}">
                    ${med.horarios.map(horId => `
                        <div class="horario-linha">
                            <input type="time" id="hor-${horId}">
                            ${med.horarios.length > 1
                                ? `<button class="btn-remover" onclick="removerHorario(${med.id}, ${horId})">✕</button>`
                                : ''}
                        </div>
                    `).join('')}
                </div>

                ${med.horarios.length < 5
                    ? `<button class="btn-secundario" onclick="adicionarHorario(${med.id})" style="margin-top:8px;">+ Horário</button>`
                    : ''}
            `
            container.appendChild(div)
        })
    }

    // ── Coleta os dados do formulário e envia ao servidor ─────
    async function enviarRotina() {
        const payload = { medicamentos: [] }

        for (const med of medicamentos) {
            const nome = document.getElementById(`nome-${med.id}`).value.trim()
            const compartimento = parseInt(document.getElementById(`comp-${med.id}`).value)
            const horarios = med.horarios
                .map(horId => document.getElementById(`hor-${horId}`).value)
                .filter(h => h !== '')

            if (!nome) {
                mostrarStatus('status-rotina', 'erro', 'Preencha o nome de todos os medicamentos.')
                return
            }
            if (horarios.length === 0) {
                mostrarStatus('status-rotina', 'erro', 'Adicione ao menos um horário por medicamento.')
                return
            }

            payload.medicamentos.push({ nome, compartimento, horarios })
        }

        try {
            const res = await fetch('/rotina', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            const data = await res.json()
            mostrarStatus('status-rotina', 'sucesso', '✅ Rotina enviada ao dispenser!')
        } catch (err) {
            mostrarStatus('status-rotina', 'erro', 'Erro ao conectar com o servidor.')
        }
    }

    // ── Envia comando manual de dispensação ───────────────────
    async function dispensarManual() {
        const compartimento = parseInt(document.getElementById('compartimento-manual').value)

        try {
            const res = await fetch('/comando', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ acao: 'dispensar', compartimento })
            })
            const data = await res.json()
            mostrarStatus('status-comando', 'sucesso', `✅ Dispensando compartimento ${compartimento}!`)
        } catch (err) {
            mostrarStatus('status-comando', 'erro', 'Erro ao conectar com o servidor.')
        }
    }

    // ── Exibe mensagem de status na tela ──────────────────────
    function mostrarStatus(elementId, tipo, mensagem) {
        const el = document.getElementById(elementId)
        el.className = `status ${tipo}`
        el.textContent = mensagem
        setTimeout(() => { el.className = 'status' }, 4000)
    }
</script>

</body>
</html>
